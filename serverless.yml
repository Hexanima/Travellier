service: travellier-api
frameworkVersion: '4'

package:
  patterns:
    - '!**/.env'
    - '!**/.env.*'
    - '!**/*.p8'
    - '!**/*.p12'
    - '!**/service-account*.json'
    - '!**/service_account*.json'
    - '!**/service.json'
    - '!**/*-firebase-adminsdk-*.json'
    - '!apps/web/**'
    - '!design/**'
    - '!docs/**'
    - '!.temp/**'
    - '!scripts/**'
    - '!infrastructure/**'

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  stackName: ${self:service}-${sls:stage}
  region: ${opt:region, 'sa-east-1'}
  logRetentionInDays: ${param:logRetentionInDays}
  httpApi:
    cors:
      # Debe ser idéntica a CorsConfiguration.AllowedOrigins del bucket; la comprueba
      # scripts/infrastructure-contract.test.mjs. Android (Capacitor 8) usa https://localhost.
      allowedOrigins:
        - capacitor://localhost
        - https://localhost
        - http://localhost
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
  environment:
    APP_ENV: ${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - Ref: MongoConfigurationSecret
            - Ref: JwtSigningSecret
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            Fn::Sub: '${PhotoBucket.Arn}/trips/*'
        # HeadObject on a missing key needs ListBucket (otherwise S3 answers 403 instead of 404). HeadObject evaluates it without
        # s3:prefix, so StringLikeIfExists; a real ListObjectsV2 must use a trips/* prefix. Scope, NOT verified against real AWS:
        # (a) StringLikeIfExists passes when s3:prefix is absent (HeadObject on a missing key: 404 instead of 403); (b) per the S3 IAM
        # docs examples a listing without Prefix sends s3:prefix as an empty string, which would NOT match trips/* (whole-bucket
        # listing denied); (c) residual: a HeadObject (404) on keys outside trips/ is covered by the condition; (d) the code never
        # lists without a prefix; (e) real verification is pending a deployment.
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            Fn::GetAtt: [PhotoBucket, Arn]
          Condition:
            StringLikeIfExists:
              s3:prefix:
                - 'trips/*'
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            Fn::Sub: '${PhotoBucket.Arn}/avatars/*'

functions:
  api:
    handler: apps/api/src/lambda.handler
    # Variables per function (least privilege): the workers never receive JWT_SECRET_ARN.
    environment:
      MONGODB_SECRET_ARN:
        Ref: MongoConfigurationSecret
      JWT_SECRET_ARN:
        Ref: JwtSigningSecret
      S3_BUCKET_NAME:
        Ref: PhotoBucket
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
  # Workers (T142). No `events`: the SQS mapping, queues, rules, roles and log groups come from infrastructure/pending-services.cjs, which
  # enables them only when param:eventsConsumerArn / param:storageDeletionConsumerArn carry this function's ARN (second authorized deploy).
  # timeout (60 s) < lease (120 s) and > internal deadline + closing margin; scripts/infrastructure-contract.test.mjs computes it from the code.
  events:
    handler: apps/api/src/events-lambda.handler
    role: EventsWorkerRole
    timeout: 60
    memorySize: 256
    disableLogs: true
    environment:
      MONGODB_SECRET_ARN:
        Ref: MongoConfigurationSecret
      PUSH_APPLICATIONS_SECRET_ARN:
        Ref: PushApplicationsSecret
  storage-deletion:
    handler: apps/api/src/storage-deletion-lambda.handler
    role: StorageDeletionWorkerRole
    timeout: 60
    memorySize: 256
    disableLogs: true
    environment:
      MONGODB_SECRET_ARN:
        Ref: MongoConfigurationSecret
      S3_BUCKET_NAME:
        Ref: PhotoBucket

stages:
  default:
    params:
      logRetentionInDays: 14
      eventsConsumerArn: ''
      storageDeletionConsumerArn: ''
      # EventBridge schedule of each worker (rate(1 minute), rate(N minutes|hours|days) or cron of 6 fields); dev and prod may override them.
      eventsScheduleExpression: rate(1 minute)
      storageDeletionScheduleExpression: rate(5 minutes)
  dev:
    params:
      logRetentionInDays: 14
  prod:
    params:
      logRetentionInDays: 90

resources:
  # The log groups are created by pending-services.cjs; the functions wait for them so Lambda does not create them first.
  # Logical names assumed from the Serverless normalization (events -> EventsLambdaFunction, storage-deletion -> StorageDashdeletionLambdaFunction):
  # NOT verified without `serverless package` (needs AWS credentials).
  - extensions:
      EventsLambdaFunction:
        DependsOn:
          - EventsWorkerLogGroup
      StorageDashdeletionLambdaFunction:
        DependsOn:
          - StorageDeletionWorkerLogGroup
  - Resources:
      PhotoBucket:
        Type: AWS::S3::Bucket
        Properties:
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          CorsConfiguration:
            CorsRules:
              - AllowedHeaders:
                  - Content-Type
                AllowedMethods:
                  - PUT
                # Idéntica a httpApi.cors.allowedOrigins (comprobado por el contrato).
                AllowedOrigins:
                  - capacitor://localhost
                  - https://localhost
                  - http://localhost
                MaxAge: 3000
          OwnershipControls:
            Rules:
              - ObjectOwnership: BucketOwnerEnforced
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
      MongoConfigurationSecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: Delete
        UpdateReplacePolicy: Delete
        Properties:
          Description: MongoDB connection settings for the Travellier ${sls:stage} environment.
      JwtSigningSecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: Delete
        UpdateReplacePolicy: Delete
        Properties:
          Description: JWT signing secret for the Travellier ${sls:stage} environment.
          GenerateSecretString:
            PasswordLength: 64
            ExcludePunctuation: true
    Outputs:
      ApiUrl:
        Description: HTTP API endpoint for the deployed environment.
        Value:
          Fn::GetAtt:
            - HttpApi
            - ApiEndpoint
      MongoConfigurationSecretArn:
        Description: ARN of the MongoDB configuration secret.
        Value:
          Ref: MongoConfigurationSecret
      JwtSigningSecretArn:
        Description: ARN of the JWT signing secret.
        Value:
          Ref: JwtSigningSecret
  - ${file(infrastructure/pending-services.cjs):resources}
