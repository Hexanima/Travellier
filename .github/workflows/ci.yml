name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn lint
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - run: corepack yarn build

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn workspace web cap:sync:android
      - run: corepack yarn workspace web cap:smoke:bundle
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native bridge on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -camera-front emulated -writable-system
          disable-animations: true
          working-directory: apps/web/android
          script: bash ../test/run-android-native-smoke.sh
      - name: Publish Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t46-android-api-${{ matrix.api-level }}
          path: |
            apps/web/android/app/build/reports/androidTests/connected/
            apps/web/android/app/build/outputs/androidTest-results/connected/
            apps/web/android-smoke-results/
